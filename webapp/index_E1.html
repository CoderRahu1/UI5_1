<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAPUI5 SimpleForm App</title>

  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_fiori_3"
    data-sap-ui-libs="sap.m,sap.ui.layout"
    data-sap-ui-resourceroots='{
      "ui5project1": "./"
    }'>
  </script>

  <style>
    html, body, #content {
      height: 100%;
      margin: 0;
    }
  </style>

  <script>
    sap.ui.getCore().attachInit(function () {
      new sap.m.App({
        pages: [
          sap.ui.xmlview("ui5project1.view.EmpDetails")
        ]
      }).placeAt("content");
    });
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
