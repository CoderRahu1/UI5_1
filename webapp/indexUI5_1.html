<!-- Code 3 with views and controllers given by CHATGPT -->

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SAPUI5 App</title>
  <script 
    src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
    id="sap-ui-bootstrap"
    data-sap-ui-theme="sap_fiori_3"
    data-sap-ui-libs="sap.m"
    data-sap-ui-resourceroots='{
      "ui5project1": "./"
    }'>
  </script>

  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.xmlview({
        viewName: "ui5project1.view.App"
      }).placeAt("content");
    });
  </script>
</head>
<body class="sapUiBody">
  <div id="content"></div>
</body>
</html>
